<html>

    <head>
    <title> Get Well Soon</title>
    <link href="static/images/logo.jpg" rel="icon" style="border-radius: 50%" />
        <link href="static/css/index.css" rel="stylesheet" type="text/css">   
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
        rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
      <!------ <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet"/>----------->
      <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
      <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
      
    </head>
    <body>
    <div class="container-fluid">
       <div class="image-container">
        <div class="image-overlay">  
            <div class="center">
            <button id="show-login"> Click Me</button>
          </div>
          <div class="popup">
            <div class="close-btn">&times;</div>
                <h2>Book Appointment</h2>
                <hr>
             <div class="main">
             <section class="left">
                <div class="cir"></div>
                <strong> Dr.Komal Chaurasiya</strong>
                <p>Btech in IT<br>
                Web Developer<br>
               <span style="font-weight: bold;"> Timing :</span><br>
                   Morning 8:00AM - 1:00PM
                  
                   <br>
                   Evening 2:00PM - 8:00PM</p>
                  <a href="#"><button class="btn btn-outline-success" 
                    style="  margin-left: 12%;margin-bottom: 9%;">Emergency Case</button></a>
             </section>
             <section class="right">
              <div class="wrapper">
                <!-- Login -->
                <div class="form-box login">
                    <h2>Login</h2>
                    <form action="#">
                        <div class="input-box">
                            <span class="icon"><ion-icon name="call-outline"></ion-icon></span>
                            <input type="tel"  name="phoneno" required>
                            <label>Username</label>
                        </div>
                        <div class="input-box">
                            <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                            <input type="password" name="password" required>
                            <label>Password</label>
                        </div>
                        <div class="remember-forget">
                            <label><input type="checkbox">Remember me</label>
                            <a href="#">Forgot Password?</a>
                        </div>
                        <button type="submit" class="btn">Login</button>
                        <div class="login-register">
                            <p>Don't have an account<a href="#" class="register-link">Register</a></p>
                        </div>
                    </form>
                </div>
        <!-- Register -->
        <div class="form-box register">
            <h2>Registration</h2>
            <form action="#">
                <div class="input-box">
                    <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
                    <input type="text" name="name" required>
                    <label>Name</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="call-outline"></ion-icon></span>
                    <input type="tel" name="phoneno" required>
                    <label>Phone No.</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                    <input type="password" name="password" required>
                    <label>Password</label>
                </div>
              
                <button type="submit" class="btn" style="margin-top: 2%;">Register</button>
                <div class="login-register">
                    <p>Already have an account?<a href="#" class="login-link">Login</a></p>
                </div>
            </form>
        </div>          

              </div>
             </section>
              
             </div>
            
        </div>
           </div>
           <img class="image" src="static/images/logo.jpg">
        </div>
        </div>
        <!-- For popup js -->
        <script>
            document.querySelector("#show-login").addEventListener("click",function(){
                document.querySelector(".popup").classList.add("active");
            });
            document.querySelector(".popup .close-btn").addEventListener("click",function(){
                document.querySelector(".popup").classList.remove("active");
            });
        </script>
        <!-- for login and register swap -->
         <script>
            const wrapper = document.querySelector('.wrapper');
            const loginLink = document.querySelector('.login-link');
            const registerLink = document.querySelector('.register-link');

            registerLink.addEventListener('click',()=>{
                wrapper.classList.add('active');
            });

            loginLink.addEventListener('click',()=>{
                wrapper.classList.remove('active');
            });
         </script>
    </body>
</html>
